name: Deploy SISO OcupaSalud

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ── JOB 1: Build + Tests ─────────────────────────────────────
  build-and-test:
    name: Build y Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
          VITE_WORKER_TOKEN: ${{ secrets.VITE_WORKER_TOKEN }}

      - name: Build producción
        run: npm run build
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
          VITE_WORKER_TOKEN: ${{ secrets.VITE_WORKER_TOKEN }}
          VITE_STABLE_DOMAIN: ${{ secrets.VITE_STABLE_DOMAIN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── JOB 2: Deploy Worker D1 ──────────────────────────────────
  deploy-worker:
    name: Deploy Worker D1
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar Wrangler
        run: npm install -g wrangler

      - name: Deploy Worker
        working-directory: siso-worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  # ── JOB 3: Deploy Cloudflare Pages ───────────────────────────
  deploy-pages:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy-worker]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy a Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=${{ secrets.CF_PAGES_PROJECT }} --branch=master
